[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-ai-agent"
version = "0.1.0"
description = "Read-only Linux health and security monitoring agent"
requires-python = ">=3.9"
dependencies = [
    "psutil==7.0.0",
    "python-dotenv==1.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["server_agent"]

[tool.coverage.run]
source = ["server_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 55
